name: Build and Deploy

on:
  push:
    branches: [main]
    paths:
      - 'app/**'

permissions:
  id-token: write   # required for OIDC - this is what lets GitHub request a token, no stored secret needed
  contents: read

env:
  AWS_REGION: eu-west-1
  ECR_REPOSITORY: lxn-demo-app
  ECS_CLUSTER: LxnDemo-Compute-ClusterEB0386A7-TQudU7Szuw4g
  ECS_SERVICE: LxnDemo-Compute-ServiceD69D759B-cpZwCLZHH0dn

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::878076318223:role/LxnDemo-GithubOidc-GithubActionsRoleF5CC769F-17DAqtYIznqa
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to ECR
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Building for arm64 explicitly, matching the ECS task's runtime
      # platform (Graviton) - a plain `docker build` on ubuntu-latest
      # runners defaults to x86_64, which is exactly the architecture
      # mismatch bug already hit once locally. Handling it here proactively.
      - name: Build and push image (arm64)
        env:
          ECR_REGISTRY: ${{ steps.ecr-login.outputs.registry }}
        run: |
          docker buildx build \
            --platform linux/arm64 \
            -t $ECR_REGISTRY/$ECR_REPOSITORY:latest \
            -t $ECR_REGISTRY/$ECR_REPOSITORY:${{ github.sha }} \
            --push \
            ./app

      - name: Force new ECS deployment
        run: |
          aws ecs update-service \
            --cluster $ECS_CLUSTER \
            --service $ECS_SERVICE \
            --force-new-deployment \
            --region $AWS_REGION
